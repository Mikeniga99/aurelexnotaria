version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: notaria_postgres
    restart: always
    environment:
      POSTGRES_USER: notaria_user
      POSTGRES_PASSWORD: notaria_password
      POSTGRES_DB: notaria_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
